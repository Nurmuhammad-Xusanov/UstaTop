services:
  - type: web
    name: ustatop
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: PORT
        value: 80
      - key: APP_URL
        fromService:
          type: web
          name: ustatop
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ustatop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ustatop-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ustatop-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ustatop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ustatop-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ustatop-lmze.onrender.com/auth/google/callback
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: c47b06001@smtp-brevo.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: nursherzil@gmail.com
      - key: MAIL_FROM_NAME
        value: UstaTop

databases:
  - name: ustatop-db
    plan: free
    region: frankfurt
    databaseName: ustatop
    user: ustatop_user
